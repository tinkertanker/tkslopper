name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate public scaffold
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.15.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Identify platform and tool versions
        id: pnpm-cache
        run: |
          . /etc/os-release
          echo "linux=${ID}-${VERSION_ID}" >> "$GITHUB_OUTPUT"
          echo "node=$(node --version)" >> "$GITHUB_OUTPUT"
          echo "pnpm=$(pnpm --version)" >> "$GITHUB_OUTPUT"
      - name: Restore installed dependencies
        id: pnpm-installed
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          # Member paths match the workspace roots in pnpm-workspace.yaml.
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          # Future project install hooks need hashed sources and cached generated outputs.
          key: pnpm-installed-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm-cache.outputs.linux }}-node-${{ steps.pnpm-cache.outputs.node }}-pnpm-${{ steps.pnpm-cache.outputs.pnpm }}-${{ github.workspace }}-${{ hashFiles('.github/workflows/ci.yml', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'apps/*/package.json', 'packages/*/package.json', '.npmrc', '.pnpmfile.cjs', 'apps/*/.npmrc', 'apps/*/.pnpmfile.cjs', 'packages/*/.npmrc', 'packages/*/.pnpmfile.cjs', 'patches/**') }}
      - run: pnpm install --frozen-lockfile
        if: steps.pnpm-installed.outputs.cache-hit != 'true'
      # Save successful installs before a later check or audit can fail.
      - name: Save installed dependencies
        if: steps.pnpm-installed.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ steps.pnpm-installed.outputs.cache-primary-key }}
      - run: pnpm check
      - run: pnpm audit --audit-level=high

  secret-scan:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full Git history with Gitleaks
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 # v8.28.0
        run: >-
          docker run --rm -v "$PWD:/repo"
          "$GITLEAKS_IMAGE"
          git --redact --verbose /repo
