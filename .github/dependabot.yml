version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      # Each @ai-sdk package pins an exact @ai-sdk/provider, which the shared
      # package also imports directly, so these move together.
      ai-sdk:
        patterns:
          - "@ai-sdk/*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: typescript
        versions:
          - ">=7.0.0"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
