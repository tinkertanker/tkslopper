version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: typescript
        versions:
          - ">=7.0.0"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
